[pytest]
testpaths = tests
pythonpath = shared/kernel tests
addopts = -p no:cacheprovider
xfail_strict = true
markers =
    docker: needs a real container engine; skipped unless QA_TEST_CONTAINER_ENGINE is set
norecursedirs = .* *.egg _darcs build CVS dist node_modules venv {arch} producers fixtures benchmark
filterwarnings =
    error::DeprecationWarning:qa
