# Generated by qa ci generate. On a clean runner this job re-runs, at commit 9e70b3d4de514dcf334707c5b730bbf9a339dd65, the runs recorded
# locally, pins itself to the configuration accepted when it was generated, and uploads the evidence as one bundle.
# It computes no verdict: import the bundle with `qa ingest bundle` where the gate is evaluated.
name: qa-reexecution

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/qa-reexecution.yml"

permissions: {}

jobs:
  reexecute:
    name: Re-run recorded commands
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: qa-reexecution
      cancel-in-progress: false
    steps:
      - name: Check out the recorded commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9e70b3d4de514dcf334707c5b730bbf9a339dd65
          persist-credentials: false
      - name: Pin the workspace to the accepted configuration
        run: |
          python3 .claude/skills/qa-release/scripts/qa.py ci begin --config-hash sha256:6ba69bc1130fd160d27470afdd9853ba0d917c33a7f7e60369b1673eccf6c890
      - name: Re-run EXE-00000000000000000000000001
        if: ${{ !cancelled() }}
        run: |
          python3 .claude/skills/qa-release/scripts/qa.py run --environment ci-github --scope targeted --report 'junit:{evidence}/junit.xml' -- python3 tests/run_junit.py --out '{evidence}/junit.xml'
      - name: Bundle the evidence
        if: ${{ !cancelled() }}
        run: |
          python3 .claude/skills/qa-release/scripts/qa.py report bundle --output "$RUNNER_TEMP/qa-evidence-bundle.tar.gz"
      - name: Upload the evidence bundle
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-evidence-bundle
          path: ${{ runner.temp }}/qa-evidence-bundle.tar.gz
          retention-days: 7
          if-no-files-found: error
