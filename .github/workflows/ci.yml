name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # L0: the repository checks. They need no installed packages.
  l0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Repository has no empty files, bad JSON or unclosed schemas
        run: python -I tools/check_repo.py
      - name: Vendored kernels equal the shared source
        run: python -I tools/vendor_kernel.py --check
      - name: Skills follow the specification and the template
        run: python -I tools/validate_skills.py
      - name: Every responsibility has exactly one owner
        run: python -I tools/check_catalog.py
      - name: Packaging follows the bundle rules
        run: python -I tools/check_packaging.py
      - name: Eval cases match their prompt tables
        run: python -I tools/build_evals.py --check
      # Pin source: newest commit on the default branch of agentskills/agentskills (2026-11-04, Apache-2.0), read with gh api.
      - name: Install the pinned reference validator
        run: python -m pip install "skills-ref @ git+https://github.com/agentskills/agentskills@83021e2be457a9b6679148719c1f6074f0ad975e#subdirectory=skills-ref"
      - name: Skills pass the reference validator
        run: |
          skills-ref validate skills/qa-api-testing
          skills-ref validate skills/qa-codebase-intelligence
          skills-ref validate skills/qa-database
          skills-ref validate skills/qa-frontend
          skills-ref validate skills/qa-mobile
          skills-ref validate skills/qa-mutation
          skills-ref validate skills/qa-orchestrator
          skills-ref validate skills/qa-performance
          skills-ref validate skills/qa-regression-guard
          skills-ref validate skills/qa-release
          skills-ref validate skills/qa-reporting
          skills-ref validate skills/qa-requirements
          skills-ref validate skills/qa-security
          skills-ref validate skills/qa-test-execution
          skills-ref validate skills/qa-test-generation
          skills-ref validate skills/qa-test-strategy
      # claude plugin validate runs on the Mac through tools/verify_install.py for every commit, not here:
      # @anthropic-ai/claude-code@2.1.321 only gets a working binary from its postinstall script, and CI runs no install scripts.

  # L1: the test suite on the oldest and the newest supported interpreter, on both operating systems.
  l1:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.15"]
        # setup-python has no Python 3.9 build for the Ubuntu that ubuntu-latest points to.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the pinned test dependencies
        run: python -m pip install --require-hashes --only-binary=":all:" -r requirements-dev.txt
      - name: Run the tests
        run: python -m pytest -v
