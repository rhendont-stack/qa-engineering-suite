name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # L0: the repository checks. They need no installed packages.
  l0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Repository has no empty files, bad JSON or unclosed schemas
        run: python -I tools/check_repo.py

  # L1: the test suite on the oldest and the newest supported interpreter, on both operating systems.
  l1:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.15"]
        # setup-python has no Python 3.9 build for the Ubuntu that ubuntu-latest points to.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the pinned test dependencies
        run: python -m pip install --require-hashes --only-binary=":all:" -r requirements-dev.txt
      - name: Run the tests
        run: python -m pytest -v
