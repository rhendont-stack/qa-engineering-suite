name: PR preview
on:
  pull_request_target:
    types:
      - opened
      - synchronize
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Label the preview
        run: echo "Preview of ${{ github.event.pull_request.title }}"
      - name: Build the preview image
        run: docker build --tag preview .
