name: PR preview
on:
  pull_request_target:
    types:
      - opened
      - synchronize
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Label the preview
        run: echo "Preview of ${{ github.event.pull_request.title }}"
      - name: Build the preview image
        run: docker build --tag preview .
